name: Validate wrapper contracts

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Install Bicep CLI
        shell: pwsh
        run: az bicep install
      - name: Validate wrapper and locked upstream contracts
        shell: pwsh
        run: .\scripts\Validate-Repository.ps1 -ValidateAllUpstreamContracts
