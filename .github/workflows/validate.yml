name: Validate wrapper contracts

on:
  pull_request:
  push:
    branches: [main]
  schedule:
    - cron: '17 4 * * 1'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: ./.github/actions/setup-powershell
      - name: Install Bicep CLI
        shell: pwsh
        run: az bicep install
      - name: Test bundled release integrity
        shell: pwsh
        run: |
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force
          Import-Module Pester -RequiredVersion 6.2.0 -Force
          Write-Host "Testing with PowerShell $($PSVersionTable.PSVersion) and Pester $((Get-Module Pester).Version)."
          $result = Invoke-Pester -Path ./tests -CI -PassThru
          if ($result.Result -ne 'Passed' -or $result.TotalCount -eq 0 -or $result.SkippedCount -or $result.InconclusiveCount -or $result.NotRunCount) {
            throw 'The complete bundled-release test suite must pass without omissions.'
          }
      - name: Validate wrapper and locked upstream contracts
        shell: pwsh
        run: .\scripts\Validate-Repository.ps1 -ValidateAllUpstreamContracts
